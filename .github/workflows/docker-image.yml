name: Docker Image CI

on:
  push:
    branches: [dev, krun]
  pull_request:
  workflow_run:
    workflows: ["Bump version"]
    types: [completed]
    branches: [main]

jobs:
  buildx:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: '0'
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get release version
        shell: bash
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || printf 'v0.1.0')"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set release channel
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) echo "RELEASE_CHANNEL=-dev" >> "$GITHUB_ENV" ;;
            krun) echo "RELEASE_CHANNEL=-krun" >> "$GITHUB_ENV" ;;
          esac

      - name: Load reproducible build pins
        run: grep -vE '^[[:space:]]*(#|$)' reproducible.env >> "$GITHUB_ENV"

      - name: Run source checks
        run: ./test.sh

      - name: Authenticate to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.BUILDKIT_REF }}

      - name: Authenticate to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select push mode
        id: mode
        shell: bash
        run: |
          push=false
          if [[ "${{ github.event_name }}" == "workflow_run" || "${GITHUB_REF_NAME}" == "dev" || "${GITHUB_REF_NAME}" == "krun" ]]; then
            push=true
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Build containers
        shell: bash
        run: |
          args=()
          [[ "${{ steps.mode.outputs.push }}" == "true" ]] && args+=(--push)
          ./build_docker_compose.sh \
            --set "*.platform=linux/amd64,linux/arm64" \
            --set "*.tags=ghcr.io/spr-networks/spr-herdr:${RELEASE_VERSION}${RELEASE_CHANNEL}" \
            --set "*.tags=ghcr.io/spr-networks/spr-herdr:latest${RELEASE_CHANNEL}" \
            "${args[@]}"

      - name: Resolve pushed digest
        id: digest
        if: ${{ steps.mode.outputs.push == 'true' }}
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/spr-networks/spr-herdr:${RELEASE_VERSION}${RELEASE_CHANNEL}" \
            --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ steps.mode.outputs.push == 'true' }}
        uses: sigstore/cosign-installer@v3.6.0

      - name: Sign published image
        if: ${{ steps.mode.outputs.push == 'true' }}
        env:
          IMAGE: ghcr.io/spr-networks/spr-herdr@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest build provenance
        if: ${{ steps.mode.outputs.push == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/spr-networks/spr-herdr
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
